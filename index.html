<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osteria Lo Spietato — Menù</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --ottone:#A87A2F; --ink:#1a1712; --carta:#f5f0e6; --carta2:#f0e9db;
    --sec:#4a4438; --hair:#9a8f7c; --err:#9c2b1a; --link:#8a5f1e;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-r:env(safe-area-inset-right,0px); --safe-l:env(safe-area-inset-left,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ottone);}
  body{font-family:'Space Mono',monospace;color:var(--ink);-webkit-tap-highlight-color:transparent;}
  a{color:var(--link);} a:hover{color:#5f3f0f;}
  button{font-family:inherit;}

  /* Menù a tutto schermo */
  .stage{min-height:100dvh;background:var(--ottone);display:flex;flex-direction:column;}
  .book{width:100%;max-width:600px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--carta);overflow:hidden;perspective:1600px;}
  .stack{position:relative;flex:1;min-height:0;}

  .sheet{position:absolute;inset:0;background:var(--carta);padding:calc(24px + var(--safe-t)) calc(26px + var(--safe-r)) calc(22px + var(--safe-b)) calc(34px + var(--safe-l));overflow:hidden;}
  .content{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;z-index:1;}
  .under{z-index:2;}
  .flip{z-index:4;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:6px 0 18px rgba(35,24,8,.25);will-change:transform;}
  .flip .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,24,8,0) 40%,rgba(35,24,8,.24));pointer-events:none;opacity:0;}
  .fold{position:absolute;inset:0 auto 0 0;width:14px;background:linear-gradient(90deg,rgba(35,24,8,.18),rgba(35,24,8,0));pointer-events:none;z-index:5;}
  [hidden]{display:none !important;}

  .enter{animation:pageIn .32s ease both;}
  @keyframes pageIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

  /* Selettore lingua */
  .langWrap{position:absolute;top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));z-index:6;}
  .langBtn{display:inline-flex;align-items:center;gap:6px;min-height:34px;background:var(--carta2);border:1.5px solid var(--ink);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;cursor:pointer;box-shadow:0 2px 8px rgba(35,24,8,.12);}
  .langBtn .car{font-size:9px;transition:transform .2s ease;}
  .langBtn[aria-expanded="true"] .car{transform:rotate(180deg);}
  .langMenu{position:absolute;top:calc(100% + 6px);right:0;min-width:158px;background:var(--carta);border:1.5px solid var(--ink);box-shadow:0 10px 24px rgba(35,24,8,.28);display:flex;flex-direction:column;}
  .langMenu button{min-height:44px;background:none;border:0;border-bottom:1px solid var(--hair);color:var(--ink);font-size:13px;text-align:left;padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .langMenu button:last-child{border-bottom:0;}
  .langMenu button[aria-current="true"]{background:var(--ink);color:var(--carta);}
  .langMenu button .code{font-size:10px;opacity:.7;letter-spacing:.1em;}

  /* Copertina */
  .cover{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 0;}
  .cover img{width:230px;max-width:80%;display:block;margin:0 auto;box-shadow:0 6px 18px rgba(35,24,8,.25);}
  .cover .word{margin:16px 0 0;font-size:13px;letter-spacing:.35em;text-transform:uppercase;}
  .cover .coperto{margin:22px 0 0;font-size:13px;border:1.5px solid var(--ink);padding:5px 14px;}
  .special{margin-top:26px;background:var(--ottone);color:#fff;padding:12px 16px;max-width:280px;box-shadow:0 6px 16px rgba(35,24,8,.22);}
  .special .lab{margin:0;font-size:10px;letter-spacing:.25em;text-transform:uppercase;}
  .special .nm{margin:6px 0 0;font-size:14px;font-weight:700;}
  .cover .hint{margin:30px 0 0;font-size:12px;color:var(--sec);line-height:1.5;max-width:280px;}
  .cover .hint .swipe{display:inline-block;animation:nudge 1.8s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}

  /* Titolo pagina */
  .htag{display:inline-block;margin:0 0 6px;background:var(--ink);color:var(--carta);font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:4px 12px;}
  .cat-section.more{margin-top:30px;}

  /* Voci */
  .items{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:18px;}
  .item .line{display:flex;align-items:baseline;gap:8px;}
  .item .nm{font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;}
  .item .leader{flex:1;border-bottom:2px dotted var(--hair);min-width:16px;align-self:flex-end;transform:translateY(-3px);}
  .item .price{font-weight:700;font-size:13.5px;white-space:nowrap;}
  .item .desc{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--sec);}
  .tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center;}
  .badge{background:var(--ottone);color:#fff;font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:2px 7px;}
  .allerg{border:1px solid var(--hair);color:var(--sec);font-size:9px;padding:1px 5px;text-decoration:none;cursor:help;}

  /* Informazioni */
  .info{margin-top:16px;font-size:13px;line-height:1.7;display:flex;flex-direction:column;gap:14px;}
  .info p{margin:0;}
  .legend ul{list-style:none;margin:6px 0 0;padding:0;font-size:12px;color:var(--sec);display:flex;flex-direction:column;gap:4px;}
  .legend .code{border:1px solid var(--hair);font-size:9px;padding:1px 5px;margin-right:6px;}
  .admin-link{margin-top:6px;font-size:11px;color:var(--link);align-self:flex-start;}

  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    .enter{animation:none;}
    .cover .hint .swipe{animation:none;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="book" id="book">
    <div class="stack" id="stack">
      <div class="sheet content enter" id="content" role="region" aria-live="polite" aria-label=""></div>
      <div class="sheet under" id="under" hidden aria-hidden="true"></div>
      <div class="sheet flip" id="flip" hidden aria-hidden="true"><div id="flipbody"></div><div class="shade" id="shade"></div></div>
      <div class="fold"></div>
      <div class="langWrap" id="langWrap">
        <button class="langBtn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
          <span aria-hidden="true">🌐</span><span id="langCode">IT</span><span class="car" aria-hidden="true">▾</span>
        </button>
        <div class="langMenu" id="langMenu" role="listbox" hidden></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { DEFAULT_MENU, ALLERGENI, MENU_KEY } from './menu-data.js';
import * as supa from './supa.js';
import { LANGS, UI, t, catName, allergName, translate, translateLines, peek, peekLines } from './i18n.js';

const $ = id => document.getElementById(id);
const el = { content:$('content'), under:$('under'), flip:$('flip'), flipbody:$('flipbody'), shade:$('shade'),
  stack:$('stack'), langWrap:$('langWrap'), langBtn:$('langBtn'), langMenu:$('langMenu'), langCode:$('langCode') };

const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const state = {
  idx: 0,
  data: null,
  lang: (localStorage.getItem('spietato-lang') || 'it'),
  token: 0            // invalida le traduzioni asincrone dopo un nuovo render
};
if (!LANGS.some(l => l.code === state.lang)) state.lang = 'it';

/* ---------- Modello delle pagine ---------- */
// Categorie che condividono la stessa pagina (nell'ordine indicato).
const PAGE_GROUPS = [ ['secondi', 'contorni'], ['dolci', 'bevande', 'amari'] ];

function pages() {
  const d = state.data;
  if (!d) return [{ type:'cover' }];
  const visible = new Map();
  for (const c of d.categorie) visible.set(c.id, { cat:c, voci:c.voci.filter(v => !v.nascosto) });
  const groupOf = new Map();
  for (const g of PAGE_GROUPS) for (const id of g) groupOf.set(id, g);

  const catPages = [];
  const done = new Set();
  for (const c of d.categorie) {
    if (done.has(c.id)) continue;
    const g = groupOf.get(c.id);
    if (g) {
      g.forEach(id => done.add(id));
      const members = g.map(id => visible.get(id)).filter(m => m && m.voci.length);
      if (members.length) catPages.push({ type:'cat', members });
    } else if (visible.get(c.id).voci.length) {
      catPages.push({ type:'cat', members:[visible.get(c.id)] });
    }
  }
  return [{ type:'cover' }, ...catPages, { type:'info' }];
}
function pageTitle(p) {
  if (!p || p.type === 'cover') return t(state.lang, 'cover');
  if (p.type === 'info') return t(state.lang, 'info');
  return p.members.map(m => catName(m.cat.id, m.cat.nome, state.lang)).join(' & ');
}
function special() {
  const d = state.data;
  return d ? d.categorie.flatMap(c => c.voci).find(v => v.delGiorno && !v.nascosto) : null;
}

/* ---------- Formattazione prezzi ---------- */
function fmt(n) {
  const v = Number(n) || 0;
  const sep = state.lang === 'en' ? '.' : ',';
  return v % 1 ? '€ ' + v.toFixed(2).replace('.', sep) : '€ ' + v;
}
function priceAria(n) {
  const v = Number(n) || 0;
  return (state.lang === 'en' ? v.toString() : v.toString().replace('.', ',')) + ' ' + t(state.lang, 'euro');
}

/* ---------- Traduzione: sincrona se in cache, altrimenti progressiva ---------- */
function mt(node, italian, token) {
  if (state.lang === 'it' || !italian) { node.textContent = italian || ''; return; }
  const hit = peek(italian, state.lang);
  if (hit != null) { node.textContent = hit; return; }              // già in cache: una sola scrittura
  node.textContent = italian;                                       // intanto l'italiano
  translate(italian, state.lang).then(tx => { if (node.isConnected && token === state.token) node.textContent = tx; });
}
function mtLines(node, italian, token) {
  if (state.lang === 'it' || !italian) { node.textContent = italian || ''; return; }
  const hit = peekLines(italian, state.lang);
  if (hit != null) { node.textContent = hit; return; }
  node.textContent = italian;
  translateLines(italian, state.lang).then(tx => { if (node.isConnected && token === state.token) node.textContent = tx; });
}
// Riempie in background la cache della lingua scelta, così lo sfoglio è già fluido.
function prewarm() {
  if (state.lang === 'it' || !state.data) return;
  const set = new Set();
  for (const c of state.data.categorie) for (const v of c.voci) { if (v.nome) set.add(v.nome); if (v.desc) set.add(v.desc); }
  if (state.data.info && state.data.info.orari) state.data.info.orari.split('\n').forEach(l => l.trim() && set.add(l));
  const list = [...set].filter(txt => peek(txt, state.lang) == null);
  let i = 0; const N = 3;                                            // concorrenza contenuta
  const run = () => { if (i < list.length) translate(list[i++], state.lang).finally(run); };
  for (let k = 0; k < N && k < list.length; k++) run();
}

/* ---------- Costruzione DOM di una pagina ---------- */
function h(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function buildItem(v, lang, token) {
  const li = h('li', 'item');
  const line = h('div', 'line');
  const nm = h('span', 'nm'); mt(nm, v.nome, token);
  const price = h('span', 'price', fmt(v.prezzo));
  price.setAttribute('aria-label', priceAria(v.prezzo));
  line.appendChild(nm); line.appendChild(h('span', 'leader')); line.appendChild(price);
  li.appendChild(line);
  if (v.desc) { const d = h('p', 'desc'); mt(d, v.desc, token); li.appendChild(d); }
  const tags = h('div', 'tags');
  if (v.delGiorno) tags.appendChild(h('span', 'badge', t(lang, 'pdg')));
  for (const code of (v.allergeni || [])) {
    const ab = document.createElement('abbr');
    ab.className = 'allerg'; ab.textContent = code;
    const full = allergName(code, lang);
    ab.title = t(lang, 'contains') + ' ' + full;
    ab.setAttribute('aria-label', t(lang, 'contains') + ' ' + full);
    tags.appendChild(ab);
  }
  if (tags.childNodes.length) li.appendChild(tags);
  return li;
}
function buildPage(i, token) {
  const pgs = pages();
  const p = pgs[clamp(i, 0, pgs.length - 1)];
  const frag = document.createDocumentFragment();
  const lang = state.lang;

  if (p.type === 'cover') {
    const c = h('div', 'cover');
    const img = h('img'); img.src = 'logo.png'; img.alt = 'Osteria Lo Spietato'; c.appendChild(img);
    c.appendChild(h('p', 'word', t(lang, 'menu')));
    if (state.data) c.appendChild(h('p', 'coperto', t(lang, 'coperto') + ' ' + fmt(state.data.coperto)));
    const sp = special();
    if (sp) {
      const box = h('div', 'special');
      box.appendChild(h('p', 'lab', t(lang, 'pdg')));
      const nm = h('p', 'nm'); mt(nm, sp.nome, token); box.appendChild(nm);
      c.appendChild(box);
    }
    const hint = h('p', 'hint');
    hint.appendChild(document.createTextNode(t(lang, 'browse') + ' '));
    hint.appendChild(h('span', 'swipe', '→'));
    c.appendChild(hint);
    frag.appendChild(c);

  } else if (p.type === 'cat') {
    p.members.forEach((m, mi) => {
      const sec = h('div', mi ? 'cat-section more' : 'cat-section');
      sec.appendChild(h('h2', 'htag', catName(m.cat.id, m.cat.nome, lang)));
      const ul = h('ul', 'items');
      for (const v of m.voci) ul.appendChild(buildItem(v, lang, token));
      sec.appendChild(ul);
      frag.appendChild(sec);
    });

  } else { // info
    const d = state.data;
    frag.appendChild(h('h2', 'htag', t(lang, 'info')));
    const box = h('div', 'info');
    const p1 = h('p'); p1.appendChild(h('strong', null, 'Osteria Lo Spietato'));
    p1.appendChild(document.createElement('br')); p1.appendChild(document.createTextNode(d.info.indirizzo));
    box.appendChild(p1);
    const p2 = h('p'); p2.appendChild(document.createTextNode(t(lang, 'phone') + ': '));
    const a = document.createElement('a'); a.href = 'tel:' + (d.info.telefono || '').replace(/\s/g, ''); a.textContent = d.info.telefono;
    p2.appendChild(a); box.appendChild(p2);
    const hrs = h('div'); hrs.appendChild(h('strong', null, t(lang, 'hours'))); hrs.appendChild(document.createElement('br'));
    const hv = h('span'); hv.style.whiteSpace = 'pre-line'; mtLines(hv, d.info.orari, token); hrs.appendChild(hv);
    box.appendChild(hrs);
    const cop = h('p'); cop.appendChild(document.createTextNode(t(lang, 'coperto') + ': ')); cop.appendChild(h('strong', null, fmt(d.coperto)));
    box.appendChild(cop);
    const leg = h('div', 'legend'); leg.appendChild(h('strong', null, t(lang, 'legend')));
    const lu = h('ul');
    for (const code of Object.keys(ALLERGENI)) {
      const li = h('li'); li.appendChild(h('span', 'code', code));
      li.appendChild(document.createTextNode(allergName(code, lang)));
      lu.appendChild(li);
    }
    leg.appendChild(lu); box.appendChild(leg);
    const adm = h('a', 'admin-link', t(lang, 'admin')); adm.href = 'admin.html';
    box.appendChild(adm);
    frag.appendChild(box);
  }
  return frag;
}

/* ---------- Render della pagina base ---------- */
function renderBase(animate) {
  state.token++;
  const pgs = pages();
  state.idx = clamp(state.idx, 0, pgs.length - 1);
  el.content.replaceChildren(buildPage(state.idx, state.token));
  el.content.scrollTop = 0;
  if (animate && !reduced) { el.content.classList.remove('enter'); void el.content.offsetWidth; el.content.classList.add('enter'); }
  updateChrome();
}
function updateChrome() {
  const pgs = pages();
  const n = state.idx + 1, m = pgs.length, title = pageTitle(pgs[clamp(state.idx, 0, m - 1)]);
  el.content.setAttribute('aria-label', t(state.lang, 'menuWord') + ', ' + t(state.lang, 'pageWord') + ' ' + n + ' ' + t(state.lang, 'ofWord') + ' ' + m + ': ' + title);
  el.langCode.textContent = state.lang.toUpperCase();
  document.documentElement.lang = state.lang;
}

/* ---------- Sfogliamento (segue il dito) ---------- */
const MAX = 165;           // gradi di rotazione a pagina girata
let turn = null;           // { dir, target }
let turning = false;       // animazione di rilascio in corso

function buildInto(sheet, i) { sheet.replaceChildren(buildPage(i, state.token)); }
// Clona la pagina già a video (con testi già tradotti): niente ricostruzione né ri-traduzione.
function cloneCurrentInto(sheet) {
  sheet.replaceChildren();
  for (const node of el.content.childNodes) sheet.appendChild(node.cloneNode(true));
}
function prepareTurn(dir) {
  const pgs = pages();
  const target = dir === 'next' ? state.idx + 1 : state.idx - 1;
  if (target < 0 || target >= pgs.length) return false;
  turn = { dir, target };
  if (dir === 'next') { buildInto(el.under, target); cloneCurrentInto(el.flipbody); }
  else                { cloneCurrentInto(el.under); buildInto(el.flipbody, target); }
  el.under.hidden = false; el.flip.hidden = false;
  setProgress(0);
  return true;
}
function setProgress(p) {
  p = clamp(p, 0, 1);
  const angle = turn.dir === 'next' ? -MAX * p : -MAX * (1 - p);
  el.flip.style.transform = 'rotateY(' + angle + 'deg)';
  el.shade.style.opacity = (turn.dir === 'next' ? p : (1 - p)) * 0.9;
}
function endTurn(commit) {
  el.flip.hidden = true; el.under.hidden = true;
  el.flip.style.transform = '';
  el.flipbody.replaceChildren(); el.under.replaceChildren();
  if (commit && turn) { state.idx = turn.target; renderBase(true); }
  turn = null; turning = false;
}
function tween(from, to, dur, onDone) {
  const t0 = performance.now();
  (function step(now) {
    const k = clamp((now - t0) / dur, 0, 1);
    const e = 1 - Math.pow(1 - k, 3);           // easeOutCubic
    setProgress(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step); else onDone();
  })(t0);
}
function go(dir) {
  if (turning) return;
  const pgs = pages();
  const target = dir === 'next' ? state.idx + 1 : state.idx - 1;
  if (target < 0 || target >= pgs.length) return;
  if (reduced) { state.idx = target; renderBase(true); return; }
  if (!prepareTurn(dir)) return;
  turning = true;
  tween(0, 1, 460, () => endTurn(true));
}

/* ---------- Trascinamento ---------- */
let drag = null;
el.stack.addEventListener('pointerdown', e => {
  if (turning) return;
  if (e.target.closest('.langWrap, a, abbr')) return;
  drag = { x0:e.clientX, y0:e.clientY, w:el.stack.clientWidth || 1, active:false, p:0, dir:null, id:e.pointerId };
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.active) {
    if (Math.abs(dy) > 14 && Math.abs(dy) >= Math.abs(dx)) { drag = null; return; }  // scroll verticale
    if (Math.abs(dx) < 12) return;
    const dir = dx < 0 ? 'next' : 'prev';
    if (reduced) { drag.active = true; drag.dir = dir; }
    else if (prepareTurn(dir)) { drag.active = true; drag.dir = dir; try { el.stack.setPointerCapture(drag.id); } catch (_) {} }
    else { drag = null; return; }
  }
  if (e.cancelable) e.preventDefault();
  drag.p = drag.dir === 'next' ? clamp(-dx / drag.w, 0, 1) : clamp(dx / drag.w, 0, 1);
  if (!reduced) setProgress(drag.p);
});
function releaseDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.active) return;
  if (reduced) { if (d.p > 0.25) go(d.dir); return; }
  const commit = d.p > 0.5;
  turning = true;
  tween(d.p, commit ? 1 : 0, 260, () => endTurn(commit));
}
window.addEventListener('pointerup', releaseDrag);
window.addEventListener('pointercancel', releaseDrag);

/* ---------- Tastiera ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go('prev');
  else if (e.key === 'ArrowRight') go('next');
});

/* ---------- Selettore lingua ---------- */
function buildLangMenu() {
  el.langMenu.replaceChildren();
  for (const l of LANGS) {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'option');
    b.setAttribute('aria-current', l.code === state.lang ? 'true' : 'false');
    b.appendChild(h('span', null, l.label));
    b.appendChild(h('span', 'code', l.code.toUpperCase()));
    b.addEventListener('click', () => { setLang(l.code); openLang(false); });
    el.langMenu.appendChild(b);
  }
}
function openLang(open) {
  el.langMenu.hidden = !open;
  el.langBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) buildLangMenu();
}
el.langBtn.addEventListener('click', e => { e.stopPropagation(); openLang(el.langMenu.hidden); });
document.addEventListener('click', e => { if (!el.langWrap.contains(e.target)) openLang(false); });
function setLang(code) {
  if (code === state.lang) return;
  state.lang = code;
  try { localStorage.setItem('spietato-lang', code); } catch (_) {}
  prewarm();
  renderBase(false);
}

/* ---------- Dati: caricamento e sincronizzazione ---------- */
async function load() {
  if (!state.data) {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem(MENU_KEY)); } catch (_) {}
    state.data = cache || DEFAULT_MENU;
    renderBase(false);
    prewarm();
  }
  try {
    const remote = await supa.fetchMenu();
    if (remote) {
      localStorage.setItem(MENU_KEY, JSON.stringify(remote));
      state.data = remote;
      if (!turning && !drag) { renderBase(false); prewarm(); }
    }
  } catch (_) { /* offline: resta la copia locale */ }
}

/* ---------- Avvio ---------- */
buildLangMenu();
load();
window.addEventListener('focus', load);
window.addEventListener('storage', load);
setInterval(load, 60000);
</script>
</body>
</html>
